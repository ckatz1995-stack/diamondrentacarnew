name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: the wix-ws-storage dependency's postinstall requires
      # Wix's private registry, and the repo's own postinstall (wix sync-types)
      # needs Wix credentials. Neither is needed to run tests or lint.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Run lint and smoke checks
        run: npm run check:smoke
